name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Reconstruye cada hora para traer los cambios de la hoja de Google Sheets.
  # ponytail: GitHub pausa los cron tras 60 días sin commits; si pasa, reactivar en Actions
  # (o un Apps Script en la hoja que dispare el workflow al editar).
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; el más nuevo cancela al anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Instalar, compilar y subir el sitio
        uses: withastro/action@v6 # Node 24 por defecto (Astro 7 pide >= 22.23)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
